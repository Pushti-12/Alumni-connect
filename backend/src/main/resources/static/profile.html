<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblance Profile Settings</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #42ae17; /* Approx. color from image */
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #eeeff1; /* Light gray background */
        }

        /* Styling for active sidebar link */
        .sidebar-link.active {
            background-color: #8a99c2; /* Darker blue for active state */
            color: white;
            border-left: 4px solid white;
        }

        /* Custom scrollbar for content area */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background-color: #9ca3af;
            border-radius: 4px;
        }

        /* Hide sidebar on small screens */
        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }
            .main-container {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="flex min-h-screen">
        <!-- Sidebar (Fixed Left) -->
        <nav class="sidebar fixed top-0 left-0 h-full bg-indigo-700 text-white shadow-xl flex flex-col z-20" style="width: var(--sidebar-width);">
            <div class="p-6 text-2xl font-semibold border-b border-indigo-600 mb-6">
               AlumniConnect
            </div>
            <ul id="sidebar-menu" class="flex-grow">
                <!-- Navigation Items -->
                <li class="sidebar-link p-4 pl-8 flex items-center space-x-3 cursor-pointer hover:bg-indigo-600 transition duration-150" data-view="job-feed">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>My Job Feed</span>
                </li>
                <li class="sidebar-link p-4 pl-8 flex items-center space-x-3 cursor-pointer active" data-view="profile">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span>Profile</span>
                </li>
                <li class="sidebar-link p-4 pl-8 flex items-center space-x-3 cursor-pointer hover:bg-indigo-600 transition duration-150" data-view="dashboard">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    <span>Dashboard</span>
                </li>
                <li class="sidebar-link p-4 pl-8 flex items-center space-x-3 cursor-pointer hover:bg-indigo-600 transition duration-150" data-view="saved-jobs">
                    <i data-lucide="bookmark" class="w-5 h-5"></i>
                    <span>Saved Jobs</span>
                </li>
            </ul>
            <div class="mt-auto py-4">
                 <li class="sidebar-link p-4 pl-8 flex items-center space-x-3 cursor-pointer hover:bg-indigo-600 transition duration-150" data-view="settings">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span>Settings</span>
                </li>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="main-container flex-1 transition-all duration-300" style="margin-left: var(--sidebar-width);">
            <!-- Header/Top Bar -->
            <header class="bg-white p-4 shadow-md flex justify-between items-center z-10 sticky top-0">
                <!-- Search Bar -->
                <div class="flex-1 max-w-lg relative">
                    <input type="text" placeholder="Search Anything" class="w-full py-2 px-4 pl-10 border border-gray-200 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                </div>
                
                <!-- User Controls -->
                <div class="flex items-center space-x-4">
                    <button class="text-gray-600 hover:text-indigo-700 p-2 rounded-full transition duration-150">
                        <i data-lucide="bell" class="w-6 h-6"></i>
                    </button>
                    <button class="text-gray-600 hover:text-indigo-700 p-2 rounded-full transition duration-150">
                        <i data-lucide="user-plus" class="w-6 h-6"></i>
                    </button>
                    <div class="flex items-center space-x-2 border-l pl-4">
                        <div class="w-10 h-10 bg-gray-200 rounded-full overflow-hidden">
                            <img src="https://placehold.co/40x40/6c6c6c/ffffff?text=TK" alt="User Avatar" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/40x40/6c6c6c/ffffff?text=TK';">
                        </div>
                        <span class="font-medium text-gray-800 hidden sm:block">Tonmoy Karmoker</span>
                        <button class="text-gray-500 hover:text-gray-700">
                            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content (Profile View) -->
            <main id="profile-view" class="p-6 lg:p-10 content-area h-[calc(100vh-80px)] overflow
