services:
  - type: web_service
    name: alumni-connect-web
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: "5000"
    databases:
      - name: alumni-connect-db
        envVarName: DATABASE_URL

  - type: postgres
    name: alumni-connect-db
    plan: starter
    databaseName: alumni_connect
